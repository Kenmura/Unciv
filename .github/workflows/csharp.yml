# CI for the C# migration (csharp/). Separate from the Kotlin/Gradle workflows, which it does not touch: it only runs when csharp/**, the rulesets
# the engine reads (android/assets/jsons/**) or this file change. Mirrors the local "Green gate" of csharp/migration/PROTOCOL.md.
# Read-only: no secrets, nothing is published (release builds stay local, see csharp/Unciv.Godot/GODOT.md).
name: C# build and test

on:
  push:
    branches: [csharp-migration]
    paths:
      - 'csharp/**'
      - 'android/assets/jsons/**'
      - '.github/workflows/csharp.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - 'android/assets/jsons/**'
      - '.github/workflows/csharp.yml'
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC: the long soak (path filters do not apply to schedules)
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the throttle job lists this workflow's recent runs

concurrency:
  group: csharp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

defaults:
  run:
    shell: bash

jobs:
  # At most one full run per hour on push: a run that starts while a real run (engine job not skipped, not cancelled) from the last
  # hour exists is skipped entirely, so frequent pushes do not queue or cancel each other. Manual dispatch and PRs always run.
  # (A schedule trigger cannot do this: it only fires from the default branch, and this file lives on csharp-migration.)
  throttle:
    name: Throttle (one push run per hour)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != push ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/csharp.yml/runs?event=push&branch=${GITHUB_REF_NAME}&created=%3E%3D${since}&per_page=50" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id")
          for id in $recent; do
            ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name | startswith("Build, format")) | select(.conclusion != "skipped" and .conclusion != "cancelled")] | length')
            if [[ "$ran" != 0 ]]; then
              echo "A full run ($id) started within the last hour: skipping this one."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

  # The Green gate. Needs only the .NET SDK (Unciv.Godot builds with the Godot.NET.Sdk NuGet package, no Godot binary).
  engine:
    name: Build, format, test, coverage
    needs: throttle
    if: github.event_name != 'schedule' && needs.throttle.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # coverage.py diffs against the PR base
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/**/*.csproj', 'csharp/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (warnings are errors)
        working-directory: csharp
        run: dotnet build -warnaserror

      - name: Format check
        working-directory: csharp
        run: dotnet format --verify-no-changes

      # One pass: the suite is split across processes (the engine statics rule out in-process parallelism) and instrumented for
      # coverage at the same time; the Coverage ratchet step below then reads the report this stored instead of running tests again.
      - name: Test and coverage (one pass)
        working-directory: csharp/migration
        run: python3 -I tools/ptest.py --no-build --coverage

      # Outside Unciv.sln because they need the Godot SDK package
      - name: Build Unciv.Godot
        working-directory: csharp
        run: dotnet build Unciv.Godot -warnaserror

      - name: Build Unciv.Godot.Harness
        working-directory: csharp
        run: dotnet build Unciv.Godot.Harness -warnaserror

      - name: Coverage ratchet
        working-directory: csharp/migration
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: python3 -I tools/coverage.py --check $(python3 -I tools/ci_base.py)

      - name: Screenshot gallery check
        working-directory: csharp/migration
        run: python3 -I tools/screenshots.py --check

      - name: Backlog check
        working-directory: csharp/migration
        run: python3 -I tools/ticket.py check

      - name: Tools unit tests
        working-directory: csharp/migration/tools
        run: python3 -I -m unittest discover -s . -p 'test_*.py'

  # Export smoke (C042): the packaged client must start from a folder outside the checkout and reach the main menu.
  client-export:
    name: Export the Linux client (smoke) and the Windows and macOS clients (archive check)
    if: github.event_name != 'schedule'
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/**/*.csproj', 'csharp/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-4.7.2
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('csharp/Unciv.Godot.Harness/tools/setup-godot.sh', 'csharp/Unciv.Godot/tools/install-export-templates.sh') }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libxcursor1 libxinerama1 libxi6 libxrandr2 fontconfig libasound2t64
      - name: Install the pinned Godot and export templates (SHA-512 checked)
        working-directory: csharp
        run: |
          Unciv.Godot.Harness/tools/setup-godot.sh --print-path
          Unciv.Godot/tools/install-export-templates.sh
      # The headless export intermittently crashes in Godot's font import; retry on SIGSEGV/SIGABRT/SIGILL only.
      - name: Package (Linux)
        working-directory: csharp
        run: Unciv.Godot/tools/retry-on-crash.sh 2 Unciv.Godot/tools/package.sh linux
      - name: Smoke the packaged build
        working-directory: csharp
        run: Unciv.Godot/tools/smoke-export.sh
      # T258: Windows and macOS are exported with the existing presets and only checked for file presence and size; nothing can run them here (UNVERIFIED, see GODOT.md).
      - name: Check the Linux archive
        working-directory: csharp
        run: python3 -I migration/tools/check_package.py linux
      - name: Package (Windows)
        working-directory: csharp
        run: Unciv.Godot/tools/retry-on-crash.sh 2 Unciv.Godot/tools/package.sh windows
      - name: Check the Windows archive (presence and size only)
        working-directory: csharp
        run: python3 -I migration/tools/check_package.py windows
      - name: Package (macOS, unsigned)
        working-directory: csharp
        run: Unciv.Godot/tools/retry-on-crash.sh 2 Unciv.Godot/tools/package.sh macos
      - name: Check the macOS archive (presence and size only)
        working-directory: csharp
        run: python3 -I migration/tools/check_package.py macos

  # T266: the dedicated server, published self-contained for linux-x64 and win-x64 (same commands as csharp-release.yml and tools/release.py), the Linux one smoke-run
  # (--help, start, LISTENING line, SIGTERM, exit 0) from the unpacked archive with no dotnet on PATH. The Windows one is only built and packed: UNVERIFIED, never run.
  # Nothing is uploaded here (read-only workflow). Skipped on schedule because engine is.
  server-publish:
    name: Publish the dedicated server (Linux smoke, Windows build only)
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/**/*.csproj', 'csharp/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish and archive each runtime
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          for rid in linux-x64 win-x64; do
            (cd csharp && dotnet publish Unciv.Server -c Release -r "$rid" --self-contained true -o "$RUNNER_TEMP/publish-$rid")
            python3 -I csharp/migration/tools/release_assets.py pack-server "$rid" "$RUNNER_TEMP/publish-$rid" "$RUNNER_TEMP/assets"
          done
      - name: Smoke the Linux server (no dotnet on PATH)
        run: |
          mkdir "$RUNNER_TEMP/smoke" && tar -xzf "$RUNNER_TEMP/assets/Unciv-server-linux-x64.tar.gz" -C "$RUNNER_TEMP/smoke"
          python3 -I csharp/migration/tools/release_assets.py smoke-server "$RUNNER_TEMP/smoke/Unciv-server-linux-x64"

  # Rendered scenarios (C008) against the committed goldens. Goldens were recorded with Fedora's Mesa llvmpipe; ubuntu's differs in blending (T246), so
  # the job compares with GoldenTolerance.Renderer (HARNESS_GOLDEN_TOLERANCE below). T239 saw it green on the runner image, so it gates like the others.
  client-scenarios:
    name: Client scenarios (Xvfb, software GL)
    # needs: engine only orders the jobs; an unrelated failing unit test must not hide the scenario result (T246), hence !cancelled()
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.throttle.outputs.run == 'true' }}
    needs: [throttle, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/**/*.csproj', 'csharp/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/godot-4.7.2
          key: godot-editor-${{ runner.os }}-${{ hashFiles('csharp/Unciv.Godot.Harness/tools/setup-godot.sh') }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libxcursor1 libxinerama1 libxi6 libxrandr2 fontconfig libasound2t64
      - name: Install the pinned Godot (SHA-512 checked)
        working-directory: csharp
        run: Unciv.Godot.Harness/tools/setup-godot.sh --print-path
      - name: Smoke scene
        working-directory: csharp/Unciv.Godot.Harness
        run: tools/run-smoke.sh
      - name: Scenarios
        working-directory: csharp/Unciv.Godot.Harness
        env:
          HARNESS_SKIP_BUILD: 1   # run-smoke.sh just built the project
          HARNESS_GOLDEN_TOLERANCE: renderer   # T246: goldens come from Fedora llvmpipe, the runner's differs in blending
        run: |
          failed=()
          while read -r name; do
            [[ -z "$name" || "$name" == \#* ]] && continue
            tools/run-scenario.sh "$name" || failed+=("$name")
          done < scenarios.txt
          # A comparison that cannot fail would pass everything: a wrong golden must be rejected
          tools/run-scenario.sh menu --expect-golden-failure || failed+=("menu --expect-golden-failure")
          if (( ${#failed[@]} )); then echo "FAILED: ${failed[*]}" >&2; exit 1; fi
      # T255: the rendered PNGs of a failed run, to compare with golden/ (the only way to see what the runner drew)
      - name: Upload the rendered scenarios
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-renders
          path: csharp/Unciv.Godot.Harness/out/
          retention-days: 7

  # Long AI-only games (T167). Env-gated, skipped by every other run.
  soak:
    name: Soak (scheduled or manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/**/*.csproj', 'csharp/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Soak
        working-directory: csharp
        env:
          UNCIV_SOAK: 1
        run: dotnet test Unciv.Core.Tests --filter Category=Soak --logger "console;verbosity=detailed"
