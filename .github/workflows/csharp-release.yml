# Release of the C# client and CLI (T279). Runs ONLY when a tag csharp-vMAJOR.MINOR.PATCH[-pre] is pushed, and creates a DRAFT GitHub release:
# the owner reviews it and publishes it by hand, nothing is ever published automatically. How to cut one: csharp/migration/GODOT.md ("Cutting a release").
# Read-only everywhere except the publish job (contents: write). The only credential is github.token; no other secrets, no third-party release action (gh).
# Windows and macOS clients are exported from Linux and only archive-checked: the notes mark them UNVERIFIED (see release_assets.py).
name: C# release (draft)

on:
  push:
    tags: ['csharp-v*']

permissions:
  contents: read

concurrency:
  group: csharp-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

defaults:
  run:
    shell: bash

jobs:
  # The tag must be a version tag (csharp-v1.2.3 or csharp-v1.2.3-rc.1), point into csharp-migration, and not have a release yet.
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag name
        run: python3 -I csharp/migration/tools/release_assets.py check-tag "$GITHUB_REF_NAME"
      - name: Tag is on csharp-migration
        run: |
          git fetch --no-tags origin csharp-migration
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on csharp-migration" >&2; exit 1; }
      - name: No release exists for the tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a release for $GITHUB_REF_NAME already exists; this workflow never overwrites one" >&2; exit 1
          fi

  # Self-contained CLI archives for linux-x64, win-x64, osx-arm64 (cross-published on Linux). Only the Linux one can be run here.
  cli:
    name: CLI archives
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/**/*.csproj', 'csharp/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish and archive each runtime
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          for rid in linux-x64 win-x64 osx-arm64; do
            (cd csharp && dotnet publish Unciv.Cli -c Release -r "$rid" --self-contained true -o "$RUNNER_TEMP/publish-$rid")
            python3 -I csharp/migration/tools/release_assets.py pack-cli "$rid" "$RUNNER_TEMP/publish-$rid" "$RUNNER_TEMP/assets"
          done
      - name: Smoke the Linux CLI (no dotnet on PATH)
        run: |
          mkdir "$RUNNER_TEMP/smoke" && tar -xzf "$RUNNER_TEMP/assets/Unciv-cli-linux-x64.tar.gz" -C "$RUNNER_TEMP/smoke"
          python3 -I csharp/migration/tools/release_assets.py smoke-cli "$RUNNER_TEMP/smoke/Unciv-cli-linux-x64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 3

  # Linux client (smoke-tested), Windows and macOS clients (archive check only), same steps as csharp.yml's client-export job.
  client:
    name: Client archives
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/**/*.csproj', 'csharp/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-4.7.2
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('csharp/Unciv.Godot.Harness/tools/setup-godot.sh', 'csharp/Unciv.Godot/tools/install-export-templates.sh') }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libxcursor1 libxinerama1 libxi6 libxrandr2 fontconfig libasound2t64
      - name: Install the pinned Godot and export templates (SHA-512 checked)
        working-directory: csharp
        run: |
          Unciv.Godot.Harness/tools/setup-godot.sh --print-path
          Unciv.Godot/tools/install-export-templates.sh
      - name: Package (Linux)
        working-directory: csharp
        run: Unciv.Godot/tools/retry-on-crash.sh 2 Unciv.Godot/tools/package.sh linux
      - name: Smoke the packaged Linux build
        working-directory: csharp
        run: Unciv.Godot/tools/smoke-export.sh
      - name: Check the Linux archive
        working-directory: csharp
        run: python3 -I migration/tools/check_package.py linux
      - name: Package (Windows)
        working-directory: csharp
        run: Unciv.Godot/tools/retry-on-crash.sh 2 Unciv.Godot/tools/package.sh windows
      - name: Check the Windows archive (presence and size only)
        working-directory: csharp
        run: python3 -I migration/tools/check_package.py windows
      - name: Package (macOS, unsigned)
        working-directory: csharp
        run: Unciv.Godot/tools/retry-on-crash.sh 2 Unciv.Godot/tools/package.sh macos
      - name: Check the macOS archive (presence and size only)
        working-directory: csharp
        run: python3 -I migration/tools/check_package.py macos
      - name: Collect the archives
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          cp csharp/Unciv.Godot/build/Unciv-client-linux.tar.gz csharp/Unciv.Godot/build/Unciv-client-windows.zip csharp/Unciv.Godot/build/Unciv-client-macos.zip "$RUNNER_TEMP/assets/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-client
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 3

  # T280 (Android in the release): add the Android job here (needs: verify, uploads an artifact named release-android), add it to
  # publish's needs, and add its archive to release_assets.py (expected_assets and the notes table).

  # The only job with write access: a DRAFT release for the tag with the archives, SHA256SUMS and the notes.
  publish:
    name: Create the draft release
    needs: [verify, cli, client]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Checksums, completeness check, notes
        run: |
          python3 -I csharp/migration/tools/release_assets.py sums "$RUNNER_TEMP/assets"
          python3 -I csharp/migration/tools/release_assets.py verify "$RUNNER_TEMP/assets"
          python3 -I csharp/migration/tools/release_assets.py notes "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%S)" "$RUNNER_TEMP/notes.md"
      - name: Create the draft release (never public, never overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Unciv Godot client ${GITHUB_REF_NAME#csharp-v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/assets/*
